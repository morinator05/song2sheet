[workspace]
resolver = "3"
members = ["crates/model", "crates/engrave", "crates/pdf", "crates/raster", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
model = { path = "crates/model" }
engrave = { path = "crates/engrave" }
pdf = { path = "crates/pdf" }
raster = { path = "crates/raster" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = "0.25"
tiny-skia = "0.12"
krilla = "0.8"

[profile.dev.package."*"]
opt-level = 2
